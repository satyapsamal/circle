<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Circle — The New Era begins 06 October 2026 at 11:11 PM IST.">
    <title>Circle — New Era</title>

    <link rel="icon" type="image/png" href="circle.png">
    <link rel="apple-touch-icon" href="circle.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #000;
            --fg: #fff;
            --muted: #8a8a8a;
            --line: rgba(255,255,255,.10);
            --surface: rgba(255,255,255,.035);
            --font-display: 'Playfair Display', serif;
            --font-ui: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: var(--bg);
            color: var(--fg);
            overflow: hidden;
        }

        body {
            min-height: 100dvh;
            font-family: var(--font-ui);
            -webkit-font-smoothing: antialiased;
            display: grid;
            place-items: center;
            position: relative;
            isolation: isolate;
        }

        body::before {
            content: "";
            position: fixed;
            width: 52vw;
            height: 52vw;
            min-width: 360px;
            min-height: 360px;
            max-width: 760px;
            max-height: 760px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(255,255,255,.065) 0%,
                rgba(255,255,255,.028) 34%,
                rgba(255,255,255,0) 72%
            );
            filter: blur(20px);
            z-index: -2;
            pointer-events: none;
            animation: breathe 6s ease-in-out infinite;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
            background-size: 80px 80px;
            mask-image: radial-gradient(circle at center, black, transparent 72%);
            -webkit-mask-image: radial-gradient(circle at center, black, transparent 72%);
            z-index: -1;
            pointer-events: none;
        }

        .page {
            width: min(92vw, 980px);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        .hero {
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: pageIn 1.1s cubic-bezier(.2,.8,.2,1) both;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 42px;
            color: #fff;
            text-decoration: none;
        }

        .brand img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            opacity: .92;
        }

        .brand-name {
            font-family: var(--font-display);
            font-size: 19px;
            font-weight: 500;
            letter-spacing: .2px;
        }

        .eyebrow {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #7e7e7e;
            margin-bottom: 17px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: clamp(46px, 7.5vw, 88px);
            line-height: .98;
            font-weight: 400;
            letter-spacing: -2.5px;
            max-width: 900px;
            margin-bottom: 19px;
        }

        .sub {
            font-size: clamp(13px, 1.5vw, 16px);
            line-height: 1.7;
            color: #8d8d8d;
            max-width: 570px;
            margin-bottom: 48px;
        }

        .countdown {
            width: min(100%, 760px);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border: 1px solid var(--line);
            border-radius: 26px;
            background: var(--surface);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow:
                0 24px 70px rgba(0,0,0,.48),
                inset 0 1px 0 rgba(255,255,255,.035);
            overflow: hidden;
        }

        .unit {
            padding: 29px 12px 27px;
            position: relative;
        }

        .unit + .unit::before {
            content: "";
            position: absolute;
            left: 0;
            top: 26%;
            height: 48%;
            width: 1px;
            background: var(--line);
        }

        .number {
            display: block;
            font-family: var(--font-display);
            font-size: clamp(34px, 5vw, 56px);
            font-weight: 400;
            line-height: 1;
            letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
            transition: opacity .2s ease, transform .2s ease;
        }

        .label {
            display: block;
            margin-top: 9px;
            font-size: 9px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #707070;
            font-weight: 500;
        }

        .release {
            margin-top: 25px;
            font-size: 10px;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: #6f6f6f;
        }

        .release strong {
            color: #aaa;
            font-weight: 500;
        }

        .status {
            margin-top: 42px;
            color: #4f4f4f;
            font-size: 10px;
            letter-spacing: 2.4px;
            text-transform: uppercase;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #fff;
            margin-right: 8px;
            vertical-align: 1px;
            animation: pulse 1.8s ease-in-out infinite;
        }

        .launch-message {
            display: none;
            font-family: var(--font-display);
            font-size: clamp(32px, 5.5vw, 68px);
            font-weight: 400;
            letter-spacing: -1.5px;
            margin-top: 8px;
        }

        .countdown.finished {
            display: none;
        }

        .hero.released .launch-message {
            display: block;
        }

        .hero.released .release,
        .hero.released .status {
            display: none;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: translateY(18px);
                filter: blur(7px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes breathe {
            0%, 100% { transform: scale(.92); opacity: .55; }
            50% { transform: scale(1.04); opacity: .95; }
        }

        @keyframes pulse {
            0%, 100% { opacity: .25; transform: scale(.85); }
            50% { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 620px) {
            .page {
                padding: 24px 16px;
            }

            .brand {
                margin-bottom: 33px;
            }

            h1 {
                letter-spacing: -1.7px;
            }

            .sub {
                margin-bottom: 36px;
                max-width: 330px;
            }

            .countdown {
                border-radius: 20px;
            }

            .unit {
                padding: 23px 6px 21px;
            }

            .label {
                font-size: 8px;
                letter-spacing: 1.8px;
            }

            .release {
                line-height: 1.7;
                max-width: 300px;
            }

            .status {
                margin-top: 31px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="hero" id="hero">
            <a class="brand" href="#" aria-label="Circle">
                <img src="circle.png" alt="" onerror="this.style.display='none'">
                <span class="brand-name">Circle</span>
            </a>

            <div class="eyebrow">A new chapter begins</div>

            <h1>The New Era of Circle.</h1>

            <p class="sub">
                Everything is about to change.
                The next version of Circle goes live at
                <strong>11:11 PM IST</strong>.
            </p>

            <div class="countdown" id="countdown" aria-label="Countdown to the release">
                <div class="unit">
                    <span class="number" id="days">00</span>
                    <span class="label">Days</span>
                </div>
                <div class="unit">
                    <span class="number" id="hours">00</span>
                    <span class="label">Hours</span>
                </div>
                <div class="unit">
                    <span class="number" id="minutes">00</span>
                    <span class="label">Minutes</span>
                </div>
                <div class="unit">
                    <span class="number" id="seconds">00</span>
                    <span class="label">Seconds</span>
                </div>
            </div>

            <div class="launch-message" id="launchMessage">
                The New Era has begun.
            </div>

            <div class="release">
                Release · <strong>06 October 2026 · 11:11 PM IST</strong>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                Preparing Circle
            </div>
        </section>
    </main>

    <script>
        (() => {
            // Fixed release moment: 06 October 2026, 11:11 PM IST (UTC+05:30).
            const RELEASE_AT = Date.parse("2026-10-06T23:11:00+05:30");

            const hero = document.getElementById("hero");
            const countdown = document.getElementById("countdown");
            const launchMessage = document.getElementById("launchMessage");

            const nodes = {
                days: document.getElementById("days"),
                hours: document.getElementById("hours"),
                minutes: document.getElementById("minutes"),
                seconds: document.getElementById("seconds")
            };

            function pad(value) {
                return String(Math.max(0, value)).padStart(2, "0");
            }

            function showReleased() {
                hero.classList.add("released");
                countdown.classList.add("finished");
                launchMessage.setAttribute("aria-live", "polite");
            }

            function tick() {
                const remaining = RELEASE_AT - Date.now();

                if (remaining <= 0) {
                    showReleased();
                    return;
                }

                const totalSeconds = Math.floor(remaining / 1000);

                const days = Math.floor(totalSeconds / 86400);
                const hours = Math.floor((totalSeconds % 86400) / 3600);
                const minutes = Math.floor((totalSeconds % 3600) / 60);
                const seconds = totalSeconds % 60;

                nodes.days.textContent = pad(days);
                nodes.hours.textContent = pad(hours);
                nodes.minutes.textContent = pad(minutes);
                nodes.seconds.textContent = pad(seconds);
            }

            tick();
            setInterval(tick, 250);
        })();
    </script>
</body>
</html>
