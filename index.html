    <style>
        :root {
            --font-ui: 'Parmigiano Headline', 'Playfair Display', serif;
            --font-conversational: 'Montserrat', sans-serif;
            
            --bg-color: #000000;
            --text-primary: #ffffff;
            --text-secondary: #808080;
            --user-bubble: #005cff;
            --ai-text: #f0f0f0;

        /* 
         * Base Resets & Typography
         * Prevent text selection globally as requested, except in inputs.
         */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10 and IE 11 */
            user-select: none; /* Standard syntax */
        }

        /* Allow selection in input fields specifically */
        input, textarea {
            -webkit-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-ui);
            overflow: hidden;
            /* Prevent casual drag behavior on the body */
            -webkit-user-drag: none;
        }

        /* Utility Classes */
        .hidden { display: none !important; opacity: 0 !important; pointer-events: none !important; }
        .font-ui { font-family: var(--font-ui); }
        .font-conversational { font-family: var(--font-conversational); }
        
        /* Smooth Text Animation System */
        .anim-element {
            transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 1.2s cubic-bezier(0.25, 1, 0.5, 1),
                        filter 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: opacity, transform, filter;
            opacity: 1;
            transform: translateY(0);
            filter: blur(0px);
        }
        .anim-enter {
            opacity: 0 !important;
            transform: translateY(6px) !important;
            filter: blur(2px) !important;
        }
        .anim-exit {
            opacity: 0 !important;
            transform: translateY(-6px) !important;
            filter: blur(2px) !important;
        }

        /* Main Layer Simple Fade */
        .main-layer-fade {
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .main-layer-visible {
            opacity: 1 !important;
        }

        /* Onboarding Sequence Styles */
        #onboarding-layer {
            position: fixed;
            inset: 0;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #intro-logo { width: 120px; height: auto; pointer-events: none; }
        #intro-brand { font-size: 32px; font-weight: 500; letter-spacing: 0.5px; }
        #intro-name-step, #intro-welcome { text-align: center; }

        #intro-name-step h2 {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 30px;
            color: var(--text-primary);
        }

        .name-input-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 8px;
            transition: border-color 0.3s ease;
        }

        #name-input {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 22px;
            text-align: center;
            outline: none;
            width: 250px;
        }
        #name-input::placeholder { color: rgba(255,255,255,0.2); font-family: var(--font-ui); }

        #name-submit {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            margin-left: 10px;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }
        #name-submit:hover { opacity: 1; }

        /* Main Interface Layout */
        #main-layer {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            width: 100%;
            position: relative;
        }

        /* Centered Header & Greeting Rotator */
        #header-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            transition: top 0.9s cubic-bezier(0.25, 1, 0.5, 1), transform 0.9s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 500;
            transition: font-size 0.9s ease, opacity 0.9s ease;
            margin: 0;
            cursor: default;
        }

        #greeting-rotator {
            font-size: 18px;
            color: var(--text-secondary);
            font-weight: 400;
            width: 100%;
            max-width: 90vw;
            padding-left: 20px;
            padding-right: 20px;
            margin: 0 auto;
            text-align: center;
            line-height: 1.4;
            word-wrap: break-word;
            pointer-events: none;
        }

        .chat-active #header-container {
            top: 24px;
            transform: translate(-50%, 0);
        }

        .chat-active .brand-title {
            font-size: 20px;
            opacity: 0.6;
        }

        /* Chat History Area */
        #chat-container {
            flex-grow: 1;
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            overflow-y: auto;
            padding: 80px 24px 20px 24px;
            opacity: 0;
            visibility: hidden;
            display: flex;
            flex-direction: column;
            gap: 32px;
            scroll-behavior: smooth;
        }

        #chat-container::-webkit-scrollbar { display: none; }
        #chat-container { -ms-overflow-style: none; scrollbar-width: none; }

        .chat-active #chat-container {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.8s ease 0.4s;
        }

        /* Conversational Messages */
        .msg-user {
            align-self: flex-end;
            background-color: var(--user-bubble);
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 24px 24px 4px 24px;
            max-width: 85%;
            font-size: 16px;
            line-height: 1.5;
            word-wrap: break-word;
            cursor: default;
        }

        .msg-ai {
            align-self: flex-start;
            color: var(--ai-text);
            max-width: 95%;
            font-size: 16px;
            line-height: 1.7;
            cursor: default;

            font-size: 18px;
            font-weight: 600;
            margin-top: 24px;
            margin-bottom: 12px;

        .msg-ai li { margin-bottom: 8px; }

        .msg-ai a { cursor: pointer; pointer-events: auto; }
        
        /* Thinking Animation */
        .thinking-dot {
            width: 10px;
            height: 10px;
            background-color: #ffffff;
            border-radius: 50%;
            animation: breathe 2s infinite ease-in-out;
            margin: 10px 0;
            align-self: flex-start;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(0.6); opacity: 0.4; }
            50% { transform: scale(1.1); opacity: 1; }

        #input-container {

            margin: 0 auto;
            padding: 10px 24px 10px 24px;
            position: relative;
            z-index: 20;
            display: flex;
            flex-direction: column;

        #suggestion-pills {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            margin-bottom: 16px;
            padding-bottom: 4px;
            scrollbar-width: none; /* Firefox */
            scroll-snap-type: x mandatory;
            transition: opacity 0.6s ease;
            cursor: grab; /* Indicates scrolling behavior on desktop */
        }
        #suggestion-pills:active {
            cursor: grabbing;
        }
        #suggestion-pills::-webkit-scrollbar { display: none; }
        
        .suggestion-pill {
            display: inline-flex;
            align-items: center;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            color: #c0c0c0;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            scroll-snap-align: start;
            flex-shrink: 0;
        }
        .suggestion-pill:hover {
            background: rgba(255,255,255,0.08);
            color: #ffffff;
            border-color: rgba(255,255,255,0.4);
        }

        /* Input Glow Layering */
        .input-wrapper-relative {
            position: relative;
            width: 100%;
        }

        .glow-clip {
            position: absolute;
            inset: -2px -2px -2px -2px; 
            border-radius: 32px;
            overflow: hidden;
            z-index: -1;
            mask-image: radial-gradient(white, black);
            -webkit-mask-image: -webkit-radial-gradient(white, black);
        }

        .glow-spinner {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg, transparent 30%, #ff0000, #ffaa00, #00ff00, #00ffff, #0000ff, #ff00ff, transparent 70%
            );
            animation: spin 4s linear infinite;
            filter: blur(6px);
            opacity: 0.85;
            transition: opacity 1s ease, filter 1s ease;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .chat-active .glow-spinner {
            opacity: 0.15;
            animation: spin 12s linear infinite;
            filter: blur(10px);
        }
        .glow-spinner-reset {
            opacity: 0.85 !important;
            filter: blur(6px) !important;
            animation: spin 4s linear infinite !important;
        }

        .input-box {
            background-color: #080808;
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            padding: 8px 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.8);
            position: relative;

        #chat-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            outline: none;

        /* Source Buttons */

            margin-top: 24px;
            display: flex;
            flex-direction: column;

            right: 24px;

        }
    </style>

         *******************************************************/
        function matchIntent(query) {
            const normalizedQuery = query.toLowerCase().replace(/[^\w\s-]/gi, ' ');
            const paddedQuery = " " + normalizedQuery + " "; 
            let matchedIntents = [];

            knowledgeBase.forEach(intent => {
                let score = 0;
                intent.keywords.forEach(kw => {
                    if (intent.id === 'casual_conversation') {
                        if (paddedQuery.includes(kw)) {
                            score += kw.length;
                        }
                    } else {
                        if (normalizedQuery.includes(kw.toLowerCase())) {
                            score += kw.length; 
                        }
                    }
                });
                if (score >= 3) {
                    matchedIntents.push({ intent: intent, score: score });
                }
            });

            if (matchedIntents.length > 0) {
                let hasSubstantive = matchedIntents.some(m => m.intent.id !== 'casual_conversation' && m.score >= 3);
                if (hasSubstantive) {
                    matchedIntents = matchedIntents.filter(m => m.intent.id !== 'casual_conversation');
                }

                matchedIntents.sort((a, b) => b.score - a.score);
                
                let topMatches = [matchedIntents[0]];
                if (matchedIntents.length > 1) {
                    let secondMatch = matchedIntents[1];
                    if (secondMatch.score >= 4 && secondMatch.intent.id !== topMatches[0].intent.id) {
                        topMatches.push(secondMatch);
                    }
                }
                
                topMatches.forEach(m => {
                    if (m.intent.id === 'casual_conversation') {
                        const randomResp = casualResponses[Math.floor(Math.random() * casualResponses.length)];
                        m.intent.markdown = randomResp;
                    }
                });

                let finalMarkdown = topMatches.map(m => m.intent.markdown).join('\n\n');
                let finalSources = [];
                
                topMatches.forEach(m => {
                    if (m.intent.sources) {
                        finalSources = finalSources.concat(m.intent.sources);
                    }
                });
                
                return { markdown: finalMarkdown, sources: finalSources };
            }

            return fallbackResponse;
        }

        /*******************************************************
         * 11. MARKDOWN PARSER & TYPEWRITER ANIMATION
         *******************************************************/
        function parseBasicMarkdown(md) {
            let html = md.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/`(.*?)`/g, '<code>$1</code>');
            html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" style="color: #ffffff; text-decoration: underline;">$1</a>');
            
            let lines = html.split('\n');
            let result = '';
            let inList = false;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (line.startsWith('## ')) {
                    if (inList) { result += '</ul>'; inList = false; }
                    result += `<h2>${line.substring(3)}</h2>`;
                } else if (line.startsWith('- ')) {
                    if (!inList) { result += '<ul>'; inList = true; }
                    result += `<li>${line.substring(2)}</li>`;
                } else if (line === '') {
                    if (inList) { result += '</ul>'; inList = false; }
                } else {
                    if (inList) { result += '</ul>'; inList = false; }
                    result += `<p>${line}</p>`;
                }
            }
            if (inList) { result += '</ul>'; }
            
            return result;
        }

        async function typewriteHTML(container, htmlString) {
            let currentHTML = "";
            let i = 0;
            const typingSpeed = 25; 

            while (i < htmlString.length) {
                if (htmlString[i] === '<') {
                    let tag = "";
                    while (htmlString[i] !== '>' && i < htmlString.length) {
                        tag += htmlString[i];
                        i++;
                    }
                    tag += '>';
                    currentHTML += tag;
                } else {
                    currentHTML += htmlString[i];
                    container.innerHTML = currentHTML;
                    scrollToBottom();
                    await sleep(typingSpeed + (Math.random() * 10));
                }
                i++;
            }
            container.innerHTML = htmlString;
            scrollToBottom();
        }

    </script>
